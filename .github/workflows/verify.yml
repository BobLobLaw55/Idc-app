name: verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Engine unit tests (acceptance tests 1–12)
        run: node --test tests/*.test.mjs
      - name: Install Playwright
        run: npm i --no-save playwright@1.49.1 && npx playwright install --with-deps chromium
      - name: Two-tab end-to-end test (local build)
        run: |
          python3 -m http.server 8765 >/dev/null 2>&1 &
          sleep 1
          node tests/e2e.mjs http://localhost:8765/
          node tests/e2e-edge.mjs http://localhost:8765/
      - name: Food photo URLs resolve
        run: node tests/check-photos.mjs

  live:
    # After a push to main, wait until GitHub Pages serves this exact commit, then test the real site.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Wait for Pages to serve this commit
        run: |
          url="https://bobloblaw55.github.io/Idc-app/"
          want=$(sha256sum js/app.js | cut -d' ' -f1)
          for i in $(seq 1 40); do
            got=$(curl -sf "${url}js/app.js?cb=$RANDOM" | sha256sum | cut -d' ' -f1 || true)
            [ "$got" = "$want" ] && echo "Live site serves this commit." && exit 0
            sleep 15
          done
          echo "Pages never served this commit's app.js" && exit 1
      - name: Install Playwright
        run: npm i --no-save playwright@1.49.1 && npx playwright install --with-deps chromium
      - name: Two-tab end-to-end test (live site)
        run: |
          node tests/e2e.mjs https://bobloblaw55.github.io/Idc-app/
          node tests/e2e-edge.mjs https://bobloblaw55.github.io/Idc-app/
