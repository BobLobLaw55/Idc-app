name: photo-review

# Manually triggered.
#  - review: contact sheets (current photo vs. CC0/public-domain candidates) → `photo-review` branch
#  - picks:  downloads chosen candidates into img/food/ (+ CREDITS.json) → `photo-review` branch
on:
  workflow_dispatch:
    inputs:
      review_ids:
        description: 'Comma-separated food ids to review (empty = all)'
        required: false
        default: ''
      picks:
        description: 'JSON {food_id: openverse_id} to download (skips review)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow==11.0.0
      - name: Review or apply picks
        env:
          REVIEW_IDS: ${{ inputs.review_ids }}
          PICKS: ${{ inputs.picks }}
        run: python tools/photo_review.py
      - name: Push results to photo-review branch
        run: |
          mkdir -p /tmp/pr && cp -r photo-review/. /tmp/pr/ && { [ -d img/food ] && cp -r img/food /tmp/pr/food || true; }
          git config user.name "photo-review bot"
          git config user.email "actions@users.noreply.github.com"
          git checkout --orphan photo-review
          git rm -rqf .
          cp -r /tmp/pr/. .
          git add -A
          git commit -qm "Photo review for ${GITHUB_SHA::7}"
          git push -f origin photo-review
