<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>idc. | Dinner, decided.</title><style>
:root{--bg:#111116;--panel:#1c1b23;--panel2:#282630;--line:#46414e;--text:#fbf7f2;--muted:#b8b0be;--accent:#ffbb70;--pink:#ff7f9d;--green:#8be0b6;--red:#ff8a8a}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 30% 0%,#282031 0,#111116 65%);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Arial,sans-serif;min-height:100vh}.wrap{max-width:780px;margin:auto;padding:18px 16px 65px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:24px}.logo{font-weight:900;font-size:39px;letter-spacing:-2px}.tiny{font-size:12px;color:var(--muted)}.eyebrow{font-weight:750;font-size:12px;color:var(--accent);text-transform:uppercase;letter-spacing:1px}h1{font-size:clamp(27px,6vw,42px);line-height:1.07;margin:8px 0}h2{font-size:23px;margin:4px 0 12px}h3{font-size:17px;margin:5px 0}.sub{color:var(--muted);line-height:1.5;margin-top:7px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:20px;margin:15px 0}.choice-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.choice{background:var(--panel2);border:1px solid var(--line);padding:14px;border-radius:16px;text-align:left;color:var(--text);cursor:pointer;min-height:97px}.choice.active{border:2px solid var(--accent);background:#38303a;padding:13px}.choice .emoji{font-size:25px;display:block;margin-bottom:7px}.choice strong{display:block;font-size:15px}.choice small{display:block;color:var(--muted);line-height:1.4;margin-top:3px}.button{border:0;cursor:pointer;border-radius:12px;padding:13px 16px;background:var(--accent);font-size:15px;font-weight:800;color:#171217}.button.secondary{background:var(--panel2);color:var(--text);border:1px solid var(--line)}.button.ghost{background:transparent;color:var(--muted);border:1px solid var(--line)}.button.danger{background:#5c2d3b;color:#ffe8ed}.button:disabled{opacity:.35;cursor:not-allowed}.button.full{width:100%;margin-top:14px}.buttons{display:flex;flex-wrap:wrap;gap:9px}.buttons>*{flex:1}.row{display:flex;align-items:center;justify-content:space-between;gap:12px}.chip{border:1px solid var(--line);border-radius:100px;padding:6px 10px;font-size:12px;color:var(--muted);white-space:nowrap}.chip.good{color:var(--green);border-color:#416f5b}.chip.warn{color:var(--accent)}.avatar{border-radius:50%;width:37px;height:37px;background:#5e405c;display:grid;place-items:center;font-weight:900}.tabs{display:flex;gap:8px;margin:15px 0}.tabs button{flex:1}.progress{height:6px;background:#3d3743;border-radius:20px;overflow:hidden;margin:20px 0}.progress>div{height:100%;background:var(--accent);transition:width .2s}.food{height:235px;border-radius:18px;background:linear-gradient(135deg,#4c3443,#312c40);display:flex;align-items:center;justify-content:center;font-size:100px;margin:16px 0 12px}.foodname{text-align:center;font-size:31px;font-weight:850}.foodhint{text-align:center;color:var(--muted);margin:6px 0 20px}.swipe-actions{display:flex;gap:8px}.swipe-actions button{flex:1}.field{margin:15px 0}.field label{font-size:13px;color:var(--muted);display:block;margin-bottom:8px}.field select,.field input{width:100%;background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:12px;padding:12px;font-size:15px}.pref{display:flex;align-items:center;justify-content:space-between;gap:8px;border-bottom:1px solid #39343f;padding:11px 0}.pref select{width:130px;background:var(--panel2);color:var(--text);padding:9px;border:1px solid var(--line);border-radius:10px}.results{display:grid;gap:11px}.restaurant{border:1px solid var(--line);border-radius:17px;padding:16px;background:var(--panel2)}.restaurant.eliminated{opacity:.42}.restaurant strong{font-size:19px}.itempair{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}.itempair>div{background:#1c1b23;border-radius:10px;padding:10px;font-size:13px;line-height:1.45}.itempair span{color:var(--accent);display:block;font-size:11px;margin-bottom:5px}.muted{color:var(--muted)}.alert{border:1px solid #665243;background:#302820;border-radius:13px;padding:12px;color:#fce0bb;font-size:13px;line-height:1.4}.success{border:1px solid #32654e;background:#1d3029;border-radius:13px;padding:14px;color:#bdf0d7}.center{text-align:center}.stephead{margin-bottom:15px}.stats{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.hr{border:0;border-top:1px solid var(--line);margin:17px 0}.small{font-size:13px}.link{border:0;background:none;color:var(--accent);text-decoration:underline;cursor:pointer;padding:4px}.profile-controls{display:flex;flex-wrap:wrap;gap:8px;margin-top:15px}.toast{position:fixed;bottom:17px;left:50%;transform:translateX(-50%);background:#37303c;padding:12px 17px;border-radius:12px;display:none;max-width:90%;z-index:5}.tag{color:var(--accent)}@media(max-width:430px){.choice-grid{grid-template-columns:1fr 1fr}.choice{padding:10px}.choice.active{padding:9px}.panel{padding:15px}.food{height:195px;font-size:79px}.button{padding:12px 10px;font-size:13px}.itempair{grid-template-columns:1fr}.wrap{padding:12px 12px 60px}}
</style></head><body><div class="wrap" id="app"></div><div class="toast" id="toast"></div><script>
// All restaurants, dishes, and scores below are fictional demo data.
const foods=[['wings','Chicken wings','🍗'],['steak','Steak','🥩'],['burger','Burgers','🍔'],['pizza','Pizza','🍕'],['tacos','Tacos','🌮'],['pasta','Pasta','🍝'],['sushi','Sushi','🍣'],['salad','Salads','🥗'],['sandwich','Sandwiches','🥪'],['seafood','Seafood','🦐'],['bbq','BBQ','🍖'],['noodles','Noodles','🍜']];
const venues=[
{id:'r1',name:'The Corner Grill',tag:'Comfort food',dishes:{wings:'Buffalo wings',steak:'Grilled sirloin',burger:'Bacon burger',salad:'Chopped salad',sandwich:'Club sandwich'},price:21,pickup:true,delivery:true,quality:88,distance:3.1},
{id:'r2',name:'Oak & Ember',tag:'Modern American',dishes:{steak:'Ribeye plate',burger:'Smash burger',pasta:'Creamy penne',seafood:'Blackened shrimp'},price:25,pickup:true,delivery:false,quality:94,distance:4.3},
{id:'r3',name:'The Saucy Chicken',tag:'Wings & casual',dishes:{wings:'Garlic-parmesan wings',burger:'Chicken burger',sandwich:'Crispy chicken sandwich',salad:'Grilled chicken salad'},price:17,pickup:true,delivery:true,quality:86,distance:2.6},
{id:'r4',name:'Little Italy Kitchen',tag:'Italian favorites',dishes:{pizza:'Margherita pizza',pasta:'Baked rigatoni',salad:'Caesar salad',sandwich:'Meatball sub',steak:'Steak tips'},price:22,pickup:true,delivery:true,quality:89,distance:4.8},
{id:'r5',name:'Taco After Dark',tag:'Tex-Mex',dishes:{tacos:'Carne asada tacos',burger:'Tex-Mex burger',wings:'Hot honey wings',salad:'Taco salad'},price:18,pickup:true,delivery:true,quality:85,distance:5.0},
{id:'r6',name:'The Backyard Table',tag:'American kitchen',dishes:{bbq:'Smoked brisket',steak:'Steak bites',burger:'Classic cheeseburger',wings:'Smoked wings',pizza:'Flatbread pizza'},price:24,pickup:true,delivery:true,quality:91,distance:6.1},
{id:'r7',name:'Noodle House Nine',tag:'Asian kitchen',dishes:{noodles:'Garlic noodles',sushi:'Salmon roll',seafood:'Shrimp noodles',salad:'Cucumber salad'},price:19,pickup:true,delivery:true,quality:90,distance:5.8},
{id:'r8',name:'Bistro on Main',tag:'Bistro',dishes:{steak:'Steak frites',sandwich:'Turkey pesto panini',burger:'Truffle burger',pasta:'Pappardelle',salad:'Harvest salad'},price:28,pickup:true,delivery:false,quality:92,distance:7.3},
{id:'r9',name:'The Weekend Slice',tag:'Pizza & sandwiches',dishes:{pizza:'Hot honey pepperoni',sandwich:'Italian grinder',wings:'Crispy hot wings',salad:'Greek salad'},price:16,pickup:true,delivery:true,quality:87,distance:4.0},
{id:'r10',name:'Coastal Plate',tag:'Seafood grill',dishes:{seafood:'Grilled mahi',steak:'Surf-and-turf steak',burger:'Pub burger',salad:'Shrimp salad'},price:25,pickup:true,delivery:true,quality:90,distance:6.5}
];
const vibes=[['date','Make It a Date','❤️','Put on real clothes.'],['fancy','Fancy AF','🥂','We’re pretending money isn’t real.'],['casual','No Big Production','🍻','Good food, low effort.'],['pickup','Grab It & Go','🚗','One of us has to get up.'],['couch','Couch Goblins','🛋️','Sweatpants. TV. No plans.'],['delivery','DoorDash & Disappear','🚪','Leave the food. Don’t make it weird.']];
function initial(){return {screen:'vibe',vibe:'couch',method:'either',budget:'30',time:'now',user:0,profiles:[{name:'You',prefs:{wings:'love',steak:'like',burger:'like',sushi:'never'}},{name:'Partner',prefs:{burger:'love',pasta:'like',pizza:'love',sushi:'dislike'}}],session:[{mode:null,swipes:{},done:false},{mode:null,swipes:{},done:false}],swipeIndex:0,excluded:[],pendingBlock:null,blockApprovals:[false,false],eliminations:[null,null],finalists:[],winner:null,backup:null,replacementVotes:[false,false],replacementReason:'busy',replacementRadius:'5',history:[],generation:0}}let S=initial();
const app=document.getElementById('app');function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function button(t,fn,cls=''){let disabled=cls.includes('disabled');return `<button class="button ${cls.replace('disabled','')}" ${disabled?'disabled':''} onclick="${fn}">${t}</button>`}function go(page){S.screen=page;render();window.scrollTo({top:0,behavior:'smooth'})}function toast(s){let el=document.getElementById('toast');el.textContent=s;el.style.display='block';setTimeout(()=>el.style.display='none',2600)}function header(){return `<header class="top"><div><span class="logo">idc.</span><div class="tiny">You pick the food. We pick the place.</div></div><div style="text-align:right"><div class="chip">FICTIONAL DATA DEMO</div><div style="margin-top:7px">${button('⚙ Profiles','go(\'profiles\')','ghost')}</div></div></header>`}function title(tag,heading,sub){return `<div class="stephead"><div class="eyebrow">${tag}</div><h1>${heading}</h1><div class="sub">${sub}</div></div>`}
function render(){let content='';if(S.screen==='vibe'){content=title('01 / set the scene','So... what’s the vibe?','Because “I don’t care” is never the whole story.')+`<div class="choice-grid">${vibes.map(v=>`<button class="choice ${S.vibe===v[0]?'active':''}" onclick="S.vibe='${v[0]}';render()"><span class="emoji">${v[2]}</span><strong>${v[1]}</strong><small>${v[3]}</small></button>`).join('')}</div><div class="panel">${button('Let’s eat →','go(\'settings\')','full')}</div>`}
else if(S.screen==='settings'){content=title('02 / tonight’s rules',S.vibe==='couch'?'Couch Goblins activated.':'Establishing the game plan.','The first partner chooses the vibe and tonight’s ground rules.')+`<div class="panel"><div class="field"><label>How’s the food getting to you?</label><div class="choice-grid">${[['delivery','🚪 Delivery'],['pickup','🚗 Pickup'],['either','🛋️ Either works']].map(x=>`<button class="choice ${S.method===x[0]?'active':''}" onclick="S.method='${x[0]}';render()"><strong>${x[1]}</strong></button>`).join('')}</div></div><div class="field"><label>Budget per person (approximate food subtotal)</label><select onchange="S.budget=this.value">${['15','20','25','30','40','50','any'].map(x=>`<option ${S.budget===x?'selected':''} value="${x}">${x==='any'?'No limit':'$'+x}</option>`).join('')}</select></div><div class="field"><label>When?</label><select onchange="S.time=this.value"><option value="now" ${S.time==='now'?'selected':''}>Soon. We’re hungry.</option><option value="later" ${S.time==='later'?'selected':''}>Later tonight</option></select></div><div class="alert">Demo restaurants have fictional menus, prices and service methods. Actual opening hours, delivery coverage and wait times are not verified.</div>${button('Start tonight’s session →','go(\'sessions\')','full')}</div>`}
else if(S.screen==='profiles'){content=title('Profiles / forever preferences','You know me.','Permanent preferences affect the default cards and matches. “Never” does not mean the restaurant itself is banned.')+`<div class="tabs">${[0,1].map(u=>button(esc(S.profiles[u].name),`S.user=${u};render()`,S.user===u?'':'secondary')).join('')}</div><div class="panel"><div class="field"><label>Display name</label><input value="${esc(S.profiles[S.user].name)}" maxlength="24" onchange="S.profiles[S.user].name=this.value.trim()||'Partner';render()"></div>${foods.map(f=>`<div class="pref"><span>${f[2]} ${f[1]}</span><select onchange="S.profiles[${S.user}].prefs['${f[0]}']=this.value">${[['love','❤️ Love'],['like','👍 Like'],['neutral','😐 Neutral'],['dislike','👎 Dislike'],['never','🚫 Never']].map(op=>`<option value="${op[0]}" ${(S.profiles[S.user].prefs[f[0]]||'neutral')===op[0]?'selected':''}>${op[1]}</option>`).join('')}</select></div>`).join('')}</div><div class="panel"><h3>Permanent restaurant exclusions</h3><p class="sub small">Blocking requires both users' approval. In this single-device demo, switch between the two.</p>${S.excluded.length?S.excluded.map(id=>`<div class="row pref"><span>${esc(venues.find(v=>v.id===id)?.name||id)}</span>${button('Unblock',`unblock('${id}')`,'secondary')}</div>`).join(''):'<p class="muted small">No restaurants jointly blocked.</p>'}${S.pendingBlock?`<div class="alert">Pending joint block: ${esc(venues.find(v=>v.id===S.pendingBlock)?.name)}<div class="profile-controls">${[0,1].map(u=>button(`${esc(S.profiles[u].name)}: ${S.blockApprovals[u]?'Approved':'Approve'}`,`approveBlock(${u})`,S.blockApprovals[u]?'':'secondary')).join('')}</div></div>`:''}</div><div class="buttons">${button('Back to session','go(\'sessions\')','secondary')}${button('Start over','reset()','ghost')}</div>`}
else if(S.screen==='sessions'){content=title('03 / dinner partners','Two people. One decision.','Each partner can swipe, or tap “idc. You Know Me.” to use saved preferences.')+`<div class="panel"><div class="stats"><span class="chip">${esc(vibes.find(x=>x[0]===S.vibe)[1])}</span><span class="chip">${S.method}</span><span class="chip">${S.budget==='any'?'No budget cap':'$'+S.budget+' / person'}</span></div>${[0,1].map(u=>`<div class="pref"><div class="row"><div class="avatar">${u===0?'1':'2'}</div><div><strong>${esc(S.profiles[u].name)}</strong><div class="tiny">${S.session[u].done?(S.session[u].mode==='skip'?'Skipped • using preferences':'Swipes submitted'):'Ready to choose'}</div></div></div>${S.session[u].done?'<span class="chip good">✓ Ready</span>':button('Choose',`selectPerson(${u})`,'secondary')}</div>`).join('')}${S.session.every(x=>x.done)?button('Find our Final Three →','makeFinalists()','full'): '<p class="muted small">Waiting for both partners. Swipes stay private until both finish.</p>'}</div><div class="buttons">${button('Edit vibe & budget','go(\'settings\')','secondary')}${button('Edit profiles','go(\'profiles\')','secondary')}</div>`}
else if(S.screen==='swipe'){let u=S.user,eligible=foods.filter(f=>S.profiles[u].prefs[f[0]]!=='never'),current=eligible.filter(f=>!(f[0] in S.session[u].swipes))[0];content=title('04 / pick your cravings',`${esc(S.profiles[u].name)}, what sounds good?`,'Your answer can be different from your partner’s.')+`<div class="panel">${current?`<div class="row"><span class="chip">${eligible.filter(f=>f[0] in S.session[u].swipes).length+1} of ${eligible.length}</span><span class="chip">${S.profiles[u].prefs[current[0]]==='love'?'❤️ Profile favorite':'Tonight only'}</span></div><div class="food">${current[2]}</div><div class="foodname">${current[1]}</div><p class="foodhint">Do we want this tonight?</p><div class="swipe-actions">${button('Nah',`chooseSwipe('${current[0]}','no')`,'danger')}${button('Maybe',`chooseSwipe('${current[0]}','maybe')`,'secondary')}${button('Hell yes',`chooseSwipe('${current[0]}','yes')`)}</div>`:'<div class="center"><h2>Cravings submitted ✓</h2><p class="sub">You made it through the whole menu.</p></div>'}${button('idc. You Know Me. →',`finishSwipes(true)`,'full secondary')}<p class="tiny center">Skip the remaining swipes. Any choices you already made still count.</p></div><div class="buttons">${button('Done choosing',`finishSwipes(false)`,'secondary')}${button('Back',`go('sessions')`,'ghost')}</div>`}
else if(S.screen==='finalists'){content=title('05 / the final three','Three restaurants. Two vetoes. One dinner.','Each partner must eliminate exactly one. Choices remain private until both submit.')+`<div class="alert">Menu options, prices, service, distance and quality scores are simulated. This is a decision-flow test, not a live restaurant search.</div><div class="results">${S.finalists.map((r,i)=>renderRestaurant(r,i)).join('')}</div><div class="panel"><h3>Eliminate one restaurant each</h3><div class="field"><label>${esc(S.profiles[0].name)} eliminates</label><select onchange="S.eliminations[0]=this.value;render()"><option value="">Choose one...</option>${S.finalists.map(r=>`<option ${S.eliminations[0]===r.id?'selected':''} value="${r.id}">${esc(r.name)}</option>`).join('')}</select></div><div class="field"><label>${esc(S.profiles[1].name)} eliminates</label><select onchange="S.eliminations[1]=this.value;render()"><option value="">Choose one...</option>${S.finalists.map(r=>`<option ${S.eliminations[1]===r.id?'selected':''} value="${r.id}">${esc(r.name)}</option>`).join('')}</select></div>${button('Decide our dinner →','decide()','full'+(!S.eliminations.every(Boolean)?' disabled':''))}</div>`}
else if(S.screen==='decision'){let win=venues.find(v=>v.id===S.winner),back=venues.find(v=>v.id===S.backup);content=title('06 / dinner decided','Well, that’s settled.','The democratic process has somehow produced food.')+`<div class="panel"><div class="eyebrow">Tonight’s winner</div><h1>${esc(win?.name||'No match')}</h1><p class="sub">${esc(win?.tag||'')} · ${win?.distance||'?'} fictional mi · Approx. $${win?.price||'?'} / person</p>${win?renderPair(win):''}<div class="success small">${S.eliminations[0]===S.eliminations[1]?'Both eliminated the same place. The higher-quality compatible survivor won.':'Different vetoes left one surviving restaurant. No tiebreaker needed.'}</div>${back?`<hr class="hr"><div class="eyebrow">Backup</div><h3>${esc(back.name)}</h3><p class="muted small">Reserved if plans fall through.</p>`:''}</div><div class="panel"><h3>Restaurant not working out?</h3><p class="sub small">Both partners must approve replacement. Never reconsider restaurants vetoed this session or permanently excluded.</p><div class="field"><label>Why replace it?</label><select onchange="S.replacementReason=this.value"><option value="busy">Too busy / long wait</option><option value="closed">Closed or closing</option><option value="changed">Changed our minds</option></select></div><div class="field"><label>Nearby replacement search radius (simulated)</label><select onchange="S.replacementRadius=this.value"><option value="3">3 miles</option><option value="5" selected>5 miles</option><option value="10">10 miles</option><option value="25">25 miles</option></select></div>${[0,1].map(u=>`<div class="pref"><span>${esc(S.profiles[u].name)} agrees to replace</span><input type="checkbox" ${S.replacementVotes[u]?'checked':''} onchange="S.replacementVotes[${u}]=this.checked;render()"></div>`).join('')}${button('Find replacement →','replace()','full'+(!S.replacementVotes.every(Boolean)?' disabled':''))}</div><div class="buttons">${button('New dinner session','newSession()','secondary')}${button('View profiles','go(\'profiles\')','ghost')}</div>`}
app.innerHTML=header()+content+`<footer class="tiny center" style="padding:25px">idc. concept prototype • Local demo only • No real business/menu verification or live ordering</footer>`;}
function selectPerson(u){S.user=u;S.session[u].mode='swipe';go('swipe')}function chooseSwipe(id,v){S.session[S.user].swipes[id]=v;render()}function finishSwipes(skip){let s=S.session[S.user];s.mode=skip?'skip':'swipe';s.done=true;go('sessions')}function prefScore(u,food){const swipe=S.session[u].swipes[food];if(swipe==='no')return -999;if(swipe==='yes')return 100;if(swipe==='maybe')return 55;const pref=S.profiles[u].prefs[food]||'neutral';return {love:90,like:69,neutral:26,dislike:4,never:-999}[pref]}
function rank(r){let dishMatches=[0,1].map(u=>{let best={score:-999,id:null};Object.keys(r.dishes).forEach(f=>{let score=prefScore(u,f);if(score>best.score)best={score,id:f}});return best});if(dishMatches.some(x=>x.score<=0))return null;if(S.excluded.includes(r.id)||S.history.includes(r.id))return null;if(S.method==='delivery'&&!r.delivery||S.method==='pickup'&&!r.pickup)return null;if(S.budget!=='any'&&r.price>Number(S.budget))return null;let min=Math.min(...dishMatches.map(x=>x.score)),avg=(dishMatches[0].score+dishMatches[1].score)/2,score=min*.55+avg*.25+r.quality*.15+(10-Math.min(10,r.distance))*0.5;return {...r,score,match:dishMatches}}
function eligible(){return venues.map(rank).filter(Boolean).sort((a,b)=>b.score-a.score||a.id.localeCompare(b.id))}function makeFinalists(){let available=eligible();if(available.length<3){toast('Fewer than three eligible demo restaurants. Widen the budget or adjust preferences.');return}S.finalists=available.slice(0,3);S.eliminations=[null,null];go('finalists')}function renderPair(r){let scored=rank(r);if(!scored)return '<div class="muted small">Menu pairing unavailable under current constraints.</div>';return `<div class="itempair">${scored.match.map((m,u)=>`<div><span>${esc(S.profiles[u].name)}</span><strong>${esc(r.dishes[m.id])}</strong><div class="tiny">${m.score>=85?'Strong fit':m.score>=50?'Possible fit':'Fallback preference'}</div></div>`).join('')}</div>`}function renderRestaurant(r,i){return `<div class="restaurant"><div class="row"><div><div class="eyebrow">Option ${i+1}</div><strong>${esc(r.name)}</strong><div class="tiny">${esc(r.tag)} · ~${r.distance} fictional miles</div></div><div class="chip good">Demo fit ${Math.round(r.score)}</div></div>${renderPair(r)}<div class="row"><span class="tiny">~$${r.price}/person · ${r.delivery?'Delivery + pickup':'Pickup only'}</span><button class="link" onclick="requestBlock('${r.id}')">Block together</button></div></div>`}
function decide(){if(!S.eliminations.every(Boolean))return;const survivors=S.finalists.filter(r=>!S.eliminations.includes(r.id));if(S.eliminations[0]===S.eliminations[1]){S.winner=survivors[0].id;S.backup=survivors[1].id}else{S.winner=survivors[0].id;let reserve=eligible().find(r=>!S.finalists.some(f=>f.id===r.id)&&!S.eliminations.includes(r.id));S.backup=reserve?.id||null}S.replacementVotes=[false,false];go('decision')}
function replace(){if(!S.replacementVotes.every(Boolean))return;let vetoes=S.eliminations.filter(Boolean);let excluded=new Set([...vetoes,S.winner,...S.history,...S.excluded]);let picks=eligible().filter(r=>!excluded.has(r.id));let chosen=picks.find(r=>r.id===S.backup)||picks[0];if(!chosen){toast('No verified replacement in this demo. Broaden constraints.');return}S.history.push(S.winner);S.winner=chosen.id;S.backup=picks.find(r=>r.id!==chosen.id)?.id||null;S.replacementVotes=[false,false];toast('Replacement selected from the remaining eligible demo options.');go('decision')}
function requestBlock(id){S.pendingBlock=id;S.blockApprovals=[false,false];go('profiles');toast('Both partners must approve the restaurant block.')}function approveBlock(u){S.blockApprovals[u]=true;if(S.blockApprovals.every(Boolean)){if(!S.excluded.includes(S.pendingBlock))S.excluded.push(S.pendingBlock);S.pendingBlock=null;S.blockApprovals=[false,false];toast('Restaurant jointly blocked.')}render()}function unblock(id){S.excluded=S.excluded.filter(x=>x!==id);render()}function newSession(){S.session=[{mode:null,swipes:{},done:false},{mode:null,swipes:{},done:false}];S.finalists=[];S.eliminations=[null,null];S.winner=null;S.backup=null;S.history=[];S.replacementVotes=[false,false];go('vibe')}function reset(){if(confirm('Reset the entire prototype including preferences and restaurant exclusions?')){S=initial();render()}}render();
</script></body></html>
